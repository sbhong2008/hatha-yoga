<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F6B66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="for Mrs Yoon's friends">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>for Mrs Yoon's friends</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+Devanagari:wght@500&display=swap">
<style>
/* Layout: one-thumb phone app. Big "today" card on top, five bottom tabs, full-screen practice player on top of everything. */
:root{
  --bg:#EDF0EA; --surface:#F8FAF6; --ink:#1E2A28; --muted:#566763; --accent:#1F6B66; --accent-ink:#FFFFFF;
  --gold:#A8681A; --line:#D3DAD2; --warn:#A33B2B; --soft:#DDE8E2;
  --font-display:"Noto Serif KR","Nanum Myeongjo",serif;
  --font-body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --font-deva:"Noto Sans Devanagari","Kohinoor Devanagari",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A19; --surface:#1B2624; --ink:#E7EEEA; --muted:#9CAEA8; --accent:#5CC0B6; --accent-ink:#0C1F1D;
  --gold:#E0B04A; --line:#2C3A37; --warn:#E58572; --soft:#22322F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A19; --surface:#1B2624; --ink:#E7EEEA; --muted:#9CAEA8; --accent:#5CC0B6; --accent-ink:#0C1F1D;
  --gold:#E0B04A; --line:#2C3A37; --warn:#E58572; --soft:#22322F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 18px/1.6 var(--font-body);
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.1rem;line-height:1.25;min-width:0}
.om{font-family:var(--font-deva);font-size:2rem;color:var(--gold);line-height:1}
.date{color:var(--muted);font-size:.9rem;text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.label{font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:700;text-transform:uppercase}
.btn{border:0;border-radius:16px;min-height:56px;padding:12px 20px;font-weight:700;font-size:1.1rem;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.small{min-height:44px;font-size:1rem;padding:8px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mood{border:2px solid var(--line);background:var(--surface);border-radius:16px;min-height:72px;font-size:1rem;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mood b{font-size:1.5rem;line-height:1}
.mood[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.week{display:flex;justify-content:space-between;gap:6px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--muted)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.today{border-color:var(--gold)}
.streak{font-family:var(--font-display);font-size:2.4rem;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.quote{font-family:var(--font-display);font-size:1.15rem;line-height:1.6}
.quote small{display:block;font-family:var(--font-body);font-size:.85rem;color:var(--muted);margin-top:6px}
.seq{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;min-height:72px}
.seq .min{font-family:var(--font-display);font-weight:700;font-size:1.5rem;color:var(--accent);min-width:3.2rem;text-align:center;font-variant-numeric:tabular-nums}
.seq small{color:var(--muted);display:block;font-size:.88rem;line-height:1.4}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.steps li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.98rem}
.steps li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;background:var(--soft);padding:2px 12px;font-size:.85rem;color:var(--accent);font-weight:500}
.pill.warn{color:var(--warn);background:transparent;border:1px solid var(--warn)}
input[type=search],textarea{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit}
.pose{border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden}
.pose>button{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;min-height:60px;cursor:pointer}
.pose>button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.pose .sa{color:var(--muted);font-size:.9rem;font-style:italic}
.pose .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;font-size:1rem}
.pose .body b{color:var(--accent)}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:none;min-height:56px;border-radius:12px;font-size:.82rem;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--soft);font-weight:700}
/* player */
.player{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:14px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.player .inner{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.95rem}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .4s}
.pname{text-align:center;display:flex;flex-direction:column;gap:2px}
.pname h1{font-size:2rem}
.pname .sa{color:var(--muted);font-style:italic}
.ring{position:relative;width:min(62vw,250px);aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:3.4rem;font-variant-numeric:tabular-nums}
.cue{text-align:center;font-size:1.2rem;min-height:3.6em}
.move{text-align:center;font-family:var(--font-display);font-size:1.45rem;font-weight:700;color:var(--accent);min-height:2.6em;display:grid;place-items:center;line-height:1.35}
.alt{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:1rem}
.ctl{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:10px;margin-top:auto}
.ctl .btn{min-height:64px}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-size:.98rem;min-height:44px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* breath */
.orb{width:min(60vw,240px);aspect-ratio:1;border-radius:50%;margin:8px auto;background:radial-gradient(circle at 35% 30%,var(--accent),var(--soft));opacity:.9;
  display:grid;place-items:center;text-align:center;color:var(--accent-ink);font-family:var(--font-display);font-size:1.5rem;transform:scale(.6);transition:transform 1s ease-in-out}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .h{font-size:.8rem;color:var(--muted)}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:.95rem;font-variant-numeric:tabular-nums}
.cal .d.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal .d.t{outline:2px solid var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{display:block;font-family:var(--font-display);font-size:1.7rem;color:var(--accent);font-variant-numeric:tabular-nums}
.stats span{font-size:.85rem;color:var(--muted)}
.log{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.98rem}
.log small{color:var(--muted);display:block}
.note{font-size:.88rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.orb,.prog i,.ring .fg{transition:none}}
</style><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{min-height:100vh}</style>
</head>
<body>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" aria-label="메뉴"></nav>
<div id="playerHost"></div>

<script>
/* ---------- 데이터 ---------- */
var POSES = {
  sukhasana:{ko:'편안한 자세 · 기도',sa:'Sukhasana',cat:'준비',fx:'다리를 교차해 앉아 마음을 가라앉힙니다. 옴을 3번 읊으며 시작합니다.',cue:'편하게 앉아 손을 가슴 앞에 모읍니다. 깊게 숨 쉬고, 옴을 세 번 읊어요.',alt:'바닥이 불편하면 의자에 앉거나 엉덩이 밑에 방석을 받쳐요.',warn:'무릎이 불편하면 방석을 높이세요.'},
  neck:{ko:'목·어깨·손목 풀기',sa:'Warm-up',cat:'준비',fx:'목, 어깨, 손목, 발목을 부드럽게 돌려 관절을 깨웁니다.',cue:'목을 천천히 좌우로 돌리고, 어깨를 크게 뒤로 돌려요.',alt:'목이 아프면 목 돌리기는 건너뛰고 어깨만 돌리세요.',warn:'목을 뒤로 젖히지 마세요.'},
  marjari:{ko:'고양이-소 자세',sa:'Marjaryasana-Bitilasana',cat:'척추',fx:'척추를 부드럽게 움직여 허리와 등의 긴장을 풉니다.',cue:'네발 자세에서 숨을 마시며 가슴을 열고, 내쉬며 등을 둥글게 말아요.',alt:'손목이 아프면 주먹을 쥐거나 팔꿈치를 바닥에 대세요.',warn:'무릎 밑에 담요를 깔아요.'},
  adho:{ko:'아래를 보는 개 자세',sa:'Adho Mukha Svanasana',cat:'전신',fx:'어깨, 햄스트링, 종아리를 늘리고 몸 전체를 깨웁니다.',cue:'엉덩이를 높이 들어 올려요. 무릎은 살짝 굽혀도 좋아요. 목은 편안하게.',alt:'손목이나 어깨가 불편하면 벽에 손을 짚고 상체를 숙이세요.',warn:'고혈압이 있으면 머리가 심장보다 낮은 시간을 짧게 하세요.'},
  uttana:{ko:'서서 앞으로 굽히기',sa:'Uttanasana',cat:'전굴',fx:'허리와 햄스트링을 이완하고 머리를 식혀 줍니다.',cue:'무릎을 살짝 굽히고 상체를 내려요. 머리와 목의 힘을 빼세요.',alt:'손을 허벅지나 의자 위에 올리고 반만 숙이세요.',warn:'허리 디스크가 있으면 무릎을 많이 굽히세요.'},
  surya:{ko:'수리야 나마스카라',sa:'Surya Namaskar',cat:'전신',fx:'태양 경배. 호흡과 동작을 맞춰 온몸을 데웁니다.',cue:'천천히 호흡에 맞춰 3바퀴 이어서 해요. 동작이 크면 작게 줄여도 됩니다.',alt:'점프나 플랭크는 생략하고, 무릎을 바닥에 내려 천천히 하세요.',warn:'어지러우면 바로 멈추고 쉬세요.'},
  tada:{ko:'산 자세',sa:'Tadasana',cat:'선 자세',fx:'바른 자세의 기본. 발바닥과 척추의 정렬을 느낍니다.',cue:'두 발로 바닥을 누르고, 정수리는 하늘로 길게 뻗어요.',alt:'균형이 불안하면 벽에 등을 대고 서세요.',warn:''},
  vira2:{ko:'전사 자세 2',sa:'Virabhadrasana II',cat:'선 자세',fx:'다리와 둔근을 단련하고 안정감과 집중력을 키웁니다.',cue:'발을 넓게 벌려 앞무릎을 굽히고 팔을 양옆으로 벌려요. 중간에 반대쪽으로 바꿉니다.',alt:'무릎 각도를 얕게 하거나 의자를 옆에 두고 짚으세요.',warn:'앞무릎이 발끝을 넘지 않게 하세요.',sides:true},
  trikona:{ko:'삼각 자세',sa:'Trikonasana',cat:'선 자세',fx:'옆구리, 햄스트링, 고관절을 늘려 줍니다.',cue:'다리를 벌리고 옆으로 길게 뻗은 뒤 손을 정강이에 올려요. 중간에 반대쪽으로 바꿉니다.',alt:'손을 정강이나 의자 위에 올리세요.',warn:'목이 불편하면 시선을 정면으로.',sides:true},
  vriksa:{ko:'나무 자세',sa:'Vrksasana',cat:'균형',fx:'균형감각과 집중력, 다리 근력을 키웁니다.',cue:'한 발로 서서 다른 발을 종아리나 허벅지 안쪽에 대요. 시선은 한 점에. 중간에 바꿉니다.',alt:'발끝만 바닥에 닿게 하고 벽을 짚으세요.',warn:'무릎 관절 위에 발을 대지 마세요.',sides:true},
  bhujanga:{ko:'코브라 자세',sa:'Bhujangasana',cat:'후굴',fx:'가슴과 척추 기립근을 강화하고 자세를 바르게 합니다.',cue:'엎드려서 숨을 마시며 가슴을 들어 올려요. 어깨는 귀에서 멀리.',alt:'팔꿈치를 바닥에 대고 스핑크스 자세로 하세요.',warn:'허리가 아프면 높이를 낮추세요.'},
  balasana:{ko:'아기 자세',sa:'Balasana',cat:'휴식',fx:'허리와 등을 이완하고 마음을 진정시킵니다.',cue:'무릎을 꿇고 상체를 앞으로 내려 이마를 바닥에 대요. 숨을 등으로 보냅니다.',alt:'무릎이 아프면 엉덩이 밑에 방석을 받치세요.',warn:'무릎이 불편하면 이 자세 대신 누워서 무릎을 안으세요.'},
  setu:{ko:'다리 자세',sa:'Setu Bandhasana',cat:'후굴',fx:'둔근과 허리를 강화하고 가슴을 열어 줍니다.',cue:'누워서 무릎을 세우고 엉덩이를 들어 올려요. 어깨는 바닥에 편안히.',alt:'엉덩이 밑에 블록이나 쿠션을 받치세요.',warn:'목을 돌리지 마세요.'},
  baddha:{ko:'나비 자세',sa:'Baddha Konasana',cat:'앉은 자세',fx:'고관절과 골반을 열고 갱년기 시기의 하복부 긴장을 풀어 줍니다.',cue:'발바닥을 마주 대고 앉아 숨을 쉬며 무릎을 가볍게 내려요. 억지로 누르지 마세요.',alt:'무릎 밑에 쿠션을 받치세요.',warn:'골반이 뻣뻣하면 상체를 숙이지 마세요.'},
  pasci:{ko:'앉아서 앞으로 굽히기',sa:'Paschimottanasana',cat:'전굴',fx:'허리와 햄스트링을 늘려 마음을 안정시킵니다.',cue:'다리를 뻗고 앉아 등을 길게 편 채 앞으로 숙여요. 무릎은 살짝 굽혀도 좋아요.',alt:'무릎 밑에 쿠션을 받치거나 수건을 발에 걸어요.',warn:'허리를 둥글게 말지 말고 척추를 길게 유지하세요.'},

var store = {log:{}, voice:true, detail:true};
function load(){try{var r=localStorage.getItem('hatha.v1');if(r){var o=JSON.parse(r);if(o)Object.keys(o).forEach(function(k){store[k]=o[k]})}}catch(e){}}

/* ---------- 유틸 ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function key(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayOfYear(d){return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)}
function mmss(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function mins(s){return Math.round(s/60)}
function streak(){var n=0,d=new Date();if(!store.log[key(d)])d.setDate(d.getDate()-1);while(store.log[key(d)]){n++;d.setDate(d.getDate()-1)}return n}
function totalMin(){var t=0;Object.keys(store.log).forEach(function(k){t+=store.log[k].sec||0});return Math.round(t/60)}

  '<section class="card"><h3>명상 타이머</h3><p class="note">편하게 앉아 호흡만 느껴요. 끝나면 종소리가 납니다.</p><div class="row">'+
  [3,5,10].map(function(m){return '<button class="btn ghost small grow" data-act="med" data-v="'+m+'">'+m+'분</button>'}).join('')+'</div></section>'+
  '<p class="note">어지럽거나 답답하면 바로 평소 호흡으로 돌아오세요.</p>';
}
function vLog(){
  var now=new Date(), base=new Date(now.getFullYear(),now.getMonth()+st.calOff,1);
  var first=base.getDay(), dim=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
  var cells=DOW.map(function(d){return '<div class="h">'+d+'</div>'}).join('');
  for(var i=0;i<first;i++)cells+='<div></div>';
  var cnt=0;
  for(var d=1;d<=dim;d++){var k=key(new Date(base.getFullYear(),base.getMonth(),d));var on=!!store.log[k];if(on)cnt++;
    cells+='<div class="d'+(on?' on':'')+(k===key(now)?' t':'')+'">'+d+'</div>'}
  var recent=Object.keys(store.log).sort().reverse().slice(0,8).map(function(k){var l=store.log[k];
    return '<div class="log"><span><b>'+k.slice(5).replace('-','월 ')+'일</b><small>'+esc(l.name||'')+(l.place?' · '+esc(l.place):'')+(l.note?'<br>'+esc(l.note):'')+'</small></span><span>'+mins(l.sec||0)+'분</span></div>'}).join('');
  return '<header class="top"><h2>기록</h2></header>'+
  '<section class="stats card" style="flex-direction:row;justify-content:space-around"><div><b>'+streak()+'</b><span>연속 일</span></div><div><b>'+cnt+'</b><span>이번 달</span></div><div><b>'+totalMin()+'</b><span>총 분</span></div></section>'+
  '<section class="card"><div class="row" style="justify-content:space-between"><button class="btn ghost small" data-act="cal" data-v="-1" aria-label="이전 달">‹</button><h3>'+base.getFullYear()+'년 '+(base.getMonth()+1)+'월</h3><button class="btn ghost small" data-act="cal" data-v="1" aria-label="다음 달">›</button></div><div class="cal">'+cells+'</div></section>'+
  '<section class="card"><div class="label">최근 수련</div>'+(recent||'<p class="note">아직 기록이 없어요. 첫 수련을 마치면 여기에 쌓입니다.</p>')+'</section>'+
  '<section class="card"><div class="label">설정</div><div class="row"><button class="chip" data-act="tg" data-v="voice" aria-pressed="'+store.voice+'">음성 안내</button><button class="chip" data-act="tg" data-v="detail" aria-pressed="'+store.detail+'">자세 해설 보기</button></div>'+
  '<p class="note">기록은 이 폰의 사파리에만 저장됩니다.</p></section>';
}

/* ---------- 소리 ---------- */
var AC=null;
function bell(f){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f||660;
  g.gain.setValueAtTime(0.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.25,AC.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+1.4);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+1.5)}catch(e){}}
function say(t){if(!store.voice)return;try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=0.9;speechSynthesis.speak(u)}catch(e){}}
var wake=null;
function wakeOn(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wake=l}).catch(function(){})}catch(e){}}
function wakeOff(){try{if(wake){wake.release();wake=null}}catch(e){}}

/* ---------- 플레이어 ---------- */
var P=null, host=document.getElementById('playerHost');
function startPlay(id){
  var s;
  if(id.indexOf(':')>0){var pr=id.split(':'),pp=POSES[pr[0]];s={id:'solo',name:pp.ko,steps:[[pr[0],+pr[1]]],total:+pr[1]}}
  else s=seqById(id);
  if(!s)return;
  P={seq:s,i:0,paused:false,left:0,end:0,half:false,showAlt:false,total:0,done:false,place:'',note:'',startedAt:Date.now()};
  bell(523);wakeOn();enter(0);
  P.timer=setInterval(tick,250);
}
function enter(i){
  P.i=i;var step=P.seq.steps[i],p=POSES[step[0]];
  P.left=step[1];P.end=Date.now()+P.left*1000;P.half=false;P.showAlt=false;P.mv=-1;
  if(!p.flow)say(p.ko+(store.detail?'. '+p.cue:''));
  paint();
  if(p.flow)flowTick(p,step);
}
function flowCyc(p){if(!p._cyc)p._cyc=p.flow.reduce(function(a,m){return a+m[1]},0);return p._cyc}
function flowIdx(p,el){var pos=el%flowCyc(p),acc=0;for(var i=0;i<p.flow.length;i++){acc+=p.flow[i][1];if(pos<acc)return i}return p.flow.length-1}
function flowTick(p,step){
  var i=flowIdx(p,step[1]-P.left);
  if(i!==P.mv){P.mv=i;var t=p.flow[i][0],e=document.getElementById('pmove');if(e)e.textContent=t;say(t)}
}
function tick(){
  if(!P||P.done||P.paused)return;
  var step=P.seq.steps[P.i],p=POSES[step[0]];
  P.left=Math.max(0,(P.end-Date.now())/1000);
  if(p.sides&&!P.half&&P.left<=step[1]/2){P.half=true;bell(440);say('반대쪽으로 바꿔요')}
  if(p.flow&&P.left>0)flowTick(p,step);
  if(P.left<=0){
    bell(660);
    if(P.i+1>=P.seq.steps.length){finish();return}
    P.total+=step[1];enter(P.i+1);return;
  }
  paintTime();
}
function finish(){
  P.done=true;clearInterval(P.timer);wakeOff();
  P.total=P.seq.total;bell(392);say('수고하셨습니다. 오늘 수련을 마쳤어요.');paint();
}
function closePlayer(){if(P){clearInterval(P.timer)}wakeOff();try{speechSynthesis.cancel()}catch(e){}P=null;host.innerHTML='';render()}
function paintTime(){
  var t=document.getElementById('ptime');if(!t)return;
  var step=P.seq.steps[P.i];t.textContent=mmss(P.left);
  var c=2*Math.PI*52;document.getElementById('pfg').style.strokeDashoffset=c*(1-(P.left/step[1]));
}
function paint(){
  if(!P)return;
  if(P.done){
    host.innerHTML='<div class="player"><div class="inner"><div class="pname" style="margin-top:20px"><span class="om" style="font-size:3rem">ॐ</span><h1>수련 완료</h1><p class="note">'+esc(P.seq.name)+' · '+mins(P.seq.total)+'분</p></div>'+
    '<div class="card"><div class="label">어디에서 하셨어요?</div><div class="opts" style="justify-content:flex-start">'+PLACES.map(function(x){return '<button class="chip" data-act="place" data-v="'+x+'" aria-pressed="'+(P.place===x)+'">'+x+'</button>'}).join('')+'</div>'+
    '<div class="label">오늘 몸과 마음 한 줄</div><textarea id="pnote" rows="2" placeholder="예: 어깨가 가벼워졌다">'+esc(P.note)+'</textarea></div>'+
    '<button class="btn" data-act="save" style="margin-top:auto">기록하고 마치기</button></div></div>';
    return;
  }
  var step=P.seq.steps[P.i],p=POSES[step[0]],n=P.seq.steps.length;
  var c=2*Math.PI*52;
  var next=P.seq.steps[P.i+1];
  host.innerHTML='<div class="player"><div class="inner">'+
  '<div class="pbar"><span>'+(P.i+1)+' / '+n+'</span><span>'+(next?'다음: '+esc(POSES[next[0]].ko):'마지막 자세')+'</span><button class="chip" data-act="quit" style="min-height:40px;padding:4px 14px">종료</button></div>'+
  '<div class="prog"><i style="width:'+(P.i/n*100)+'%"></i></div>'+
  '<div class="pname"><h1>'+esc(p.ko)+'</h1><span class="sa">'+esc(p.sa)+'</span></div>'+
  '<div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="pfg" cx="60" cy="60" r="52" style="stroke-dasharray:'+c+';stroke-dashoffset:'+(c*(1-P.left/step[1]))+'"/></svg><div class="t" id="ptime" role="timer">'+mmss(P.left)+'</div></div>'+
  (p.flow?'<p class="move" id="pmove">'+(P.mv>=0?esc(p.flow[P.mv][0]):'')+'</p>':'')+
  (store.detail?'<p class="cue">'+esc(p.cue)+'</p>':'<p class="cue" style="color:var(--muted)">호흡에 집중하세요</p>')+
  (P.showAlt?'<div class="alt"><b>아프거나 힘들면</b><br>'+esc(p.alt)+(p.warn?'<br><span style="color:var(--warn)">'+esc(p.warn)+'</span>':'')+'</div>':'')+
  '<div class="opts"><button class="chip" data-act="alt" aria-pressed="'+P.showAlt+'">아파요 · 대체 동작</button><button class="chip" data-act="pvoice" aria-pressed="'+store.voice+'">음성</button><button class="chip" data-act="pdetail" aria-pressed="'+store.detail+'">해설</button></div>'+
  '<div class="ctl"><button class="btn ghost" data-act="prev" aria-label="이전">이전</button><button class="btn" data-act="pause">'+(P.paused?'계속':'일시정지')+'</button><button class="btn ghost" data-act="skip" aria-label="다음">다음</button></div>'+
  '</div></div>';
}

/* ---------- 호흡 ---------- */
var B={run:false,t:null,phase:0,round:0,pid:null};
function bpaint(){var o=document.getElementById('orb');if(!o)return}
function bstop(msg){clearTimeout(B.t);B.run=false;var o=document.getElementById('orb'),l=document.getElementById('olab'),b=document.getElementById('bbtn');
  if(o){o.style.transitionDuration='1s';o.style.transform='scale(.6)'}if(l)l.textContent=msg||'준비';if(b)b.textContent='시작';try{speechSynthesis.cancel()}catch(e){}wakeOff()}
function bstart(){
  if(B.run){bstop();return}
  var b=BREATHS.filter(function(x){return x.id===st.breath})[0];
  B.run=true;B.round=0;B.phase=0;document.getElementById('bbtn').textContent='멈추기';wakeOn();bell(523);bphase(b);
}
function bphase(b){
  if(!B.run)return;
  var o=document.getElementById('orb'),l=document.getElementById('olab'),cn=document.getElementById('ocnt');
  if(!o){B.run=false;return}
  var names=['들이쉬세요','멈추세요','내쉬세요','쉬세요'],secs=b.pat[B.phase];
  if(!secs){B.phase=(B.phase+1)%4;if(B.phase===0){B.round++}return bphase(b)}
  if(B.round>=b.rounds){bell(392);bstop('마쳤어요');say('수고하셨습니다');return}
  l.textContent=names[B.phase]+' '+secs;
  o.style.transitionDuration=(B.phase===0||B.phase===2?secs:0.3)+'s';
  if(B.phase===0)o.style.transform='scale(1)';else if(B.phase===2)o.style.transform='scale(.6)';
  if(cn)cn.textContent=(B.round+1)+' / '+b.rounds+'회';
  if(B.phase===0&&B.round%2===0&&B.round===0)say(names[0]);
  B.t=setTimeout(function(){B.phase=(B.phase+1)%4;if(B.phase===0)B.round++;bphase(b)},secs*1000);
}
function med(m){
  var o=document.getElementById('orb');B.run=false;clearTimeout(B.t);bell(523);wakeOn();
  var end=Date.now()+m*60000,l=document.getElementById('olab');if(o){o.style.transitionDuration='4s';o.style.transform='scale(1)'}
  B.run=true;document.getElementById('bbtn').textContent='멈추기';
  (function loop(){if(!B.run)return;var r=(end-Date.now())/1000;if(r<=0){bell(392);bstop('마쳤어요');return}
    var e=document.getElementById('olab');if(!e){B.run=false;return}e.textContent=mmss(r);B.t=setTimeout(loop,500)})();
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  if(a==='tab'){if(B.run)bstop();st.tab=v;render();window.scrollTo(0,0)}
  else if(a==='mood'){st.mood=st.mood===+v?null:+v;render()}
  else if(a==='play'||a==='solo'){startPlay(v)}
  else if(a==='time'){st.time=+v||0;render()}
  else if(a==='cat'){st.cat=v;render()}
  else if(a==='seqopen'){st.seqOpen=st.seqOpen===v?null:v;render()}
  else if(a==='open'){st.open=st.open===v?null:v;render()}
  else if(a==='bsel'){if(B.run)bstop();st.breath=v;render()}
  else if(a==='bstart'){bstart()}
  else if(a==='med'){med(+v)}
  else if(a==='cal'){st.calOff+=+v;render()}
  else if(a==='tg'){store[v]=!store[v];save();render()}
  else if(P){
    if(a==='pause'){if(P.paused){P.end=Date.now()+P.left*1000;P.paused=false}else{P.paused=true}paint()}
    else if(a==='skip'){if(P.i+1>=P.seq.steps.length)finish();else enter(P.i+1)}
    else if(a==='prev'){enter(Math.max(0,P.i-1))}
    else if(a==='alt'){P.showAlt=!P.showAlt;paint()}
    else if(a==='pvoice'){store.voice=!store.voice;save();if(!store.voice){try{speechSynthesis.cancel()}catch(x){}}paint()}
    else if(a==='pdetail'){store.detail=!store.detail;save();paint()}
    else if(a==='quit'){closePlayer()}
    else if(a==='place'){var ta=document.getElementById('pnote');if(ta)P.note=ta.value;P.place=P.place===v?'':v;paint()}
    else if(a==='save'){
      var ta2=document.getElementById('pnote');var k=key(),prev=store.log[k]||{sec:0};
      store.log[k]={name:P.seq.name,sec:(prev.sec||0)+P.seq.total,place:P.place||prev.place||'',note:(ta2&&ta2.value.trim())||prev.note||''};
      save();st.tab='log';closePlayer();
    }
  }
});
document.addEventListener('input',function(e){if(e.target.id==='q'){st.q=e.target.value;var pos=e.target.selectionStart;render();var q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(x){}}}});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&P&&!P.done)wakeOn()});

render();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
